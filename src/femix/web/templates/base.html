<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Femix{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" href="/static/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="icon" href="/static/icono.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
    <meta name="theme-color" content="#22255e">
    <meta name="description" content="Femix: tu asistente, siempre a mano. Chat, agenda, citas, recordatorios y tareas.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Femix">
</head>
<body>
    <header class="cabecera">
        <a class="marca" href="/usuario/chat" aria-label="Femix">
            <img src="/static/icono.svg" alt="" width="32" height="32">
            <span>femix</span>
        </a>
    </header>
    <main class="contenido">
        {% block content %}{% endblock %}
    </main>
    <script src="/static/js/app.js"></script>
    <script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(function () {});</script>
</body>
</html>
